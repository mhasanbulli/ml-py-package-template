
default_stages: [pre-push]
repos:
  - repo: https://github.com/crate-ci/typos
    rev: v1.34.0
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        pass_filenames: false
        language: system
        types: [python]
      - id: test
        name: test
        entry: uv run pytest
        pass_filenames: false
        language: system
        types: [python]
